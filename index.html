<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMagnet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#0b0f1a] text-slate-200 overflow-hidden" id="bodyTag">

    <div class="flex h-screen">
        <aside id="sidebar"
            class="w-20 md:w-64 border-r border-slate-800 flex flex-col p-5 bg-[#0b0f1a] z-50 transition-all">
            <div class="mb-10 px-2 flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-rose-600 rounded-lg flex items-center justify-center shadow-lg shadow-rose-600/40">
                    <i class="fas fa-magnet text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight hidden md:block">MOVIE<span
                        class="text-rose-600">MAGNET</span></h1>
            </div>

            <nav class="flex-1 space-y-2" id="navLinks">
                <button onclick="changeCategory('/movie/popular', 'Popular Movies', this)"
                    class="sidebar-link active w-full flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:bg-slate-800 transition">
                    <i class="fas fa-fire w-6 text-center"></i> <span
                        class="hidden md:inline font-semibold">Trending</span>
                </button>
                <button onclick="changeCategory('/tv/popular', 'TV Series', this)"
                    class="sidebar-link w-full flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:bg-slate-800 transition">
                    <i class="fas fa-desktop w-6 text-center"></i> <span class="hidden md:inline font-semibold">TV
                        Shows</span>
                </button>
                <button onclick="changeCategory('/person/popular', 'Celebrities', this)"
                    class="sidebar-link w-full flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:bg-slate-800 transition">
                    <i class="fas fa-users w-6 text-center"></i> <span
                        class="hidden md:inline font-semibold">Actors</span>
                </button>
                <button onclick="showFavorites()"
                    class="sidebar-link w-full flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:bg-slate-800 transition">
                    <i class="fas fa-heart w-6 text-center"></i> <span
                        class="hidden md:inline font-semibold">Favorites</span>
                </button>

                <button onclick="showWatchlist()"
                    class="sidebar-link w-full flex items-center gap-4 p-3 rounded-xl text-slate-400 hover:bg-slate-800 transition">
                    <i class="fas fa-bookmark w-6 text-center"></i> <span
                        class="hidden md:inline font-semibold">Watchlist</span>
                </button>
            </nav>

            <button id="themeToggle"
                class="p-4 mt-auto bg-slate-800/50 rounded-2xl hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center gap-3">
                <i class="fas fa-moon" id="themeIcon"></i> <span class="hidden md:inline font-bold text-sm">Switch
                    Theme</span>
            </button>
        </aside>

        <main class="flex-1 flex flex-col overflow-y-auto bg-[#0b0f1a]" id="mainScroll">
            <header class="p-6 sticky top-0 bg-[#0b0f1a]/60 backdrop-blur-xl z-40 border-b border-slate-800/50">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div class="relative w-full max-w-2xl">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="searchInput" placeholder="Search for movies, actors or shows..."
                            class="w-full bg-slate-900/50 border border-slate-700 py-4 pl-14 pr-6 rounded-2xl focus:ring-2 focus:ring-rose-600 outline-none transition-all text-sm">
                    </div>
                    <!-- Sign in / Sign up button work Start -->
                    <a href="signin.html"
                        class="bg-rose-600 hover:bg-rose-700 px-6 py-4 rounded-2xl font-bold transition-all whitespace-nowrap shadow-lg flex items-center justify-center">
                        <i class="fas fa-user mr-2"></i> Sign In
                    </a>
                    <!-- Sign in / Sign up button work End-->
                </div>

                <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar" id="genreContainer">
                    <button onclick="filterByGenre(28, 'Action', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Action</button>
                    <button onclick="filterByGenre(35, 'Comedy', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Comedy</button>
                    <button onclick="filterByGenre(27, 'Horror', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Horror</button>
                    <button onclick="filterByGenre(878, 'Sci-Fi', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Sci-Fi</button>
                    <button onclick="filterByGenre(10749, 'Romance', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Romance</button>
                </div>
            </header>

            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <h2 id="sectionTitle" class="text-3xl font-extrabold tracking-tight">Trending Now</h2>
                    <div id="loading"
                        class="hidden loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8">
                    </div>
                </div>

                <div id="movieGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6"></div>

                <div class="flex justify-center py-16">
                    <button id="loadMore"
                        class="group bg-slate-800 hover:bg-rose-600 text-white font-bold py-4 px-12 rounded-2xl transition-all shadow-xl flex items-center gap-3">
                        <span>Load More Content</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform"></i>
                    </button>
                </div>
            </div>

            <footer class="mt-auto border-t border-slate-800 p-8 text-center text-slate-500 text-sm">
                <p>© 2026 MovieMagnet Pro. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <div id="trailerModal" class="fixed inset-0 z-[100] hidden bg-black/95 flex items-center justify-center p-4">
        <div
            class="relative w-full max-w-6xl bg-[#0f172a] rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row h-[90vh] md:h-auto">
            <button onclick="closeTrailer()"
                class="absolute top-4 right-4 z-[120] bg-rose-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:scale-110 transition shadow-lg">
                <i class="fas fa-times text-xl"></i>
            </button>

            <div class="w-full md:w-2/3 bg-black flex items-center justify-center aspect-video md:aspect-auto">
                <div id="videoContainer" class="w-full h-full"></div>
            </div>

            <div id="infoPanel" class="w-full md:w-1/3 p-8 overflow-y-auto bg-slate-900/50 backdrop-blur-md">
                <h2 id="modalTitle" class="text-3xl font-bold mb-2">Movie Title</h2>
                <div class="flex items-center gap-3 mb-6">
                    <span id="modalRating"
                        class="bg-rose-600 text-white text-xs font-bold px-2 py-1 rounded">Rating</span>
                    <span id="modalDate" class="text-slate-400 text-sm">Year</span>
                </div>
                <h4 class="text-rose-500 font-bold uppercase text-xs tracking-widest mb-2">Storyline</h4>
                <p id="modalDesc" class="text-slate-300 text-sm leading-relaxed mb-8">Loading overview...</p>
                <div id="modalLinks"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
